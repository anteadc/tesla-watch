name: Tesla Model Y CPO Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a mock Telegram message instead of checking Tesla"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check inventory
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
        run: python scripts/tesla_check.py

      - name: Commit updated state
        run: |
          git config user.name "tesla-watch-bot"
          git config user.email "actions@github.com"
          git add seen_vins.json
          git diff --staged --quiet || git commit -m "Update seen VINs"
          git push
